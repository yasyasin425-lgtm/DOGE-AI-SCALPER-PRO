
name: Test Historical Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Historical Recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
        run: python recovery.py
