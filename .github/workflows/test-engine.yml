
name: Test Cloud Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy simplejson

      - name: Check Python files
        run: |
          python -m py_compile config.py money.py risk.py strategy.py paper_engine.py learning.py storage.py engine.py test_paper_engine.py test_precision.py

      - name: Run 17 Paper Engine Tests
        run: python -m unittest -v test_paper_engine

      - name: Test Cloud Storage Precision
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
        run: python test_precision.py

      - name: Test Cloud Engine V4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
        run: python engine.py
