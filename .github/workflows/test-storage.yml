
name: Test Supabase Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Test Supabase V2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
        run: |
          python - <<'PY'
          import storage

          url, key = storage.get_config()

          expected = "https://lfsvkgbbulorwpsjsfbk.supabase.co"

          print("URL matches:", url == expected)
          print("Secret key:", key.startswith("sb_secret_"))

          if url != expected:
              raise RuntimeError("Incorrect project URL")

          if not key.startswith("sb_secret_"):
              raise RuntimeError("Incorrect key type")

          result = storage.test_connection()

          print("Connected:", result["connected"])
          print("Wallet verified:", abs(result["balance"] - 75.24457009867103) < 0.000001)
          print("Signals count:", result["signals_count"])
          print("Closed trades:", result["closed_trades"])
          print("Open position:", result["open_position"])
          print("Writes enabled:", result["writes_enabled"])
          PY
